services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: asset_management_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-asset_management}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-asset_management}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asset_management_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: asset_management_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - asset_management_network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: asset_management_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - asset_management_network

  minio_init:
    image: minio/mc:latest
    container_name: asset_management_minio_init
    depends_on:
      - minio
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} && \
        mc mb -p local/attachments || true && \
        mc anonymous set download local/attachments || true && \
        cat > /tmp/attachments-cors.json << 'EOF'
        [
          {
            "AllowedOrigins": [
              "http://localhost:3000",
              "http://127.0.0.1:3000"
            ],
            "AllowedMethods": [
              "GET",
              "PUT",
              "POST",
              "DELETE",
              "HEAD"
            ],
            "AllowedHeaders": [
              "*"
            ],
            "ExposeHeaders": [
              "ETag"
            ],
            "MaxAgeSeconds": 3600
          }
        ]
        EOF
        mc cors set local/attachments /tmp/attachments-cors.json || true
    networks:
      - asset_management_network

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: asset_management_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - asset_management_network

  # Backend API
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: asset_management_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-asset_management}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-tIRsAEcKfeyd8YN2SqdaiKZWCkinh-KcCm96v0PlDfM}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      HOST: 0.0.0.0
      PORT: 8000
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PYTHONUNBUFFERED: 1
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-hamza.mbarki2002@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-krhcqurxeiazyvbt}
      FROM_EMAIL: ${FROM_EMAIL:-hamza.mbarki2002@gmail.com}
      FROM_NAME: ${FROM_NAME:-Asset Management System}
      OSS_SERVICE_URL: http://minio:9000/
      OSS_API_KEY: ${OSS_API_KEY:-minioadmin}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-minioadmin}
      OSS_PUBLIC_URL: http://localhost:9000/
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - asset_management_network

  celery_worker:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: asset_management_celery_worker
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-asset_management}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PYTHONUNBUFFERED: 1
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://guest:guest@rabbitmq:5672//}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-hamza.mbarki2002@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-krhcqurxeiazyvbt}
      FROM_EMAIL: ${SMTP_USERNAME:-hamza.mbarki2002@gmail.com}
      FROM_NAME: ${FROM_NAME:-Asset Management System}
      OSS_SERVICE_URL: http://minio:9000/
      OSS_API_KEY: ${OSS_API_KEY:-minioadmin}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-minioadmin}
      OSS_PUBLIC_URL: http://localhost:9000/
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    command: ["celery", "-A", "core.celery_app", "worker", "-l", "info"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - asset_management_network

  # Frontend
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: asset_management_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - asset_management_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  minio_data:
    driver: local

networks:
  asset_management_network:
    driver: bridge