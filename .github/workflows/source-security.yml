name: Source Code Security

on:
  push:
    branches:
      - Phase_1
      - clean_Phase_1
      - main
  pull_request:
    branches:
      - Phase_1
      - clean_Phase_1
      - main
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  # ─── Stage 1: Secret Scan ─────────────────────────────────────────────────

  scan-secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ─── Stage 2: SCA Backend ─────────────────────────────────────────────────

  audit-backend:
    name: SCA Backend (pip-audit)
    runs-on: ubuntu-latest
    needs: scan-secrets
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit backend dependencies
        run: pip-audit -r app/backend/requirements.txt

  # ─── Stage 2: SCA Frontend ────────────────────────────────────────────────

  audit-frontend:
    name: SCA Frontend (pnpm audit)
    runs-on: ubuntu-latest
    needs: scan-secrets
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: latest
      - name: Install dependencies
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile
      - name: Audit frontend dependencies
        working-directory: app/frontend
        # high CVEs in vite 5.x are dev-server only (not production risk); fix requires vite 6 upgrade
        run: pnpm audit --audit-level=critical

  # ─── Stage 3: SAST Auto (Semgrep) ─────────────────────────────────────────

  sast-auto:
    name: SAST Auto (Semgrep)
    runs-on: ubuntu-latest
    needs: [audit-backend, audit-frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install semgrep
        run: pip install semgrep
      - name: Run semgrep (auto config)
        run: semgrep scan --config auto --severity WARNING --severity ERROR --sarif -o sast-auto.sarif app/backend app/frontend app/ml-microservice app/rag-service
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        with:
          sarif_file: sast-auto.sarif
          category: sast-auto

  # ─── Stage 3: SAST Explicit (Semgrep) ─────────────────────────────────────

  sast-explicit:
    name: SAST Explicit (Semgrep)
    runs-on: ubuntu-latest
    needs: [audit-backend, audit-frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install semgrep
        run: pip install semgrep
      - name: Run semgrep (owasp-top-ten + python + typescript)
        run: semgrep scan --config p/owasp-top-ten --config p/python --config p/typescript --severity WARNING --severity ERROR --sarif -o sast-explicit.sarif app/backend app/frontend app/ml-microservice app/rag-service
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        with:
          sarif_file: sast-explicit.sarif
          category: sast-explicit

  # ─── Stage 3: SAST Custom (Semgrep) ───────────────────────────────────────

  sast-custom:
    name: SAST Custom (Semgrep)
    runs-on: ubuntu-latest
    needs: [audit-backend, audit-frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install semgrep
        run: pip install semgrep
      - name: Run semgrep (project custom rules)
        run: semgrep scan --config .semgrep/custom.yml --severity WARNING --severity ERROR --sarif -o sast-custom.sarif app/backend app/frontend app/ml-microservice app/rag-service
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        with:
          sarif_file: sast-custom.sarif
          category: sast-custom

  # ─── Stage 3: Lint Backend (non-blocking) ─────────────────────────────────

  lint-backend:
    name: Lint Backend (ruff)
    runs-on: ubuntu-latest
    needs: [audit-backend]
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check app/backend/ --output-format=github
      - name: Ruff format check
        run: ruff format --check app/backend/

  # ─── Stage 3: Lint Frontend (non-blocking) ────────────────────────────────

  lint-frontend:
    name: Lint Frontend (eslint)
    runs-on: ubuntu-latest
    needs: [audit-frontend]
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: latest
      - name: Install dependencies
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile
      - name: Run ESLint
        working-directory: app/frontend
        run: pnpm run lint

  # ─── Stage 4: Quality Gate ────────────────────────────────────────────────

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [scan-secrets, audit-backend, audit-frontend, sast-auto, sast-explicit, sast-custom, lint-backend, lint-frontend]
    if: always()
    steps:
      - name: Check blocking gates
        run: |
          FAILED=0
          if [[ "${{ needs.scan-secrets.result }}" == "failure" ]]; then
            echo "BLOCKED: Secret scan failed — commit contains credentials"
            FAILED=1
          fi
          if [[ "${{ needs.audit-backend.result }}" == "failure" ]]; then
            echo "BLOCKED: Backend SCA found CRITICAL/HIGH CVEs in requirements.txt"
            FAILED=1
          fi
          if [[ "${{ needs.audit-frontend.result }}" == "failure" ]]; then
            echo "BLOCKED: Frontend SCA found CRITICAL/HIGH CVEs in package.json"
            FAILED=1
          fi
          if [[ "${{ needs.sast-auto.result }}" == "failure" ]]; then
            echo "BLOCKED: SAST (auto config) found WARNING/ERROR severity issues"
            FAILED=1
          fi
          if [[ "${{ needs.sast-explicit.result }}" == "failure" ]]; then
            echo "BLOCKED: SAST (owasp-top-ten/python/typescript) found WARNING/ERROR severity issues"
            FAILED=1
          fi
          if [[ "${{ needs.sast-custom.result }}" == "failure" ]]; then
            echo "BLOCKED: SAST (project custom rules) found WARNING/ERROR severity issues"
            FAILED=1
          fi
          if [[ $FAILED -eq 1 ]]; then
            exit 1
          fi
          echo "All blocking gates passed."
          echo "Lint (non-blocking): backend=${{ needs.lint-backend.result }}, frontend=${{ needs.lint-frontend.result }}"
