# EAMSagemCom — Source Code Security Pipeline
# Stages: secret-scan → sca-deps → sast → sonarqube → build → image-scan → lint → gate
# Blocking: secret-scan, sca-deps, sast, sonarqube, build, image-scan, gate
# Non-blocking: lint (allow_failure: true)
# sonarqube-scan requires a self-hosted runner tagged "local" + local SonarQube on http://host.docker.internal:9090

stages:
  - secret-scan
  - sca-deps
  - sast
  - sonarqube
  - build
  - image-scan
  - lint
  - gate

variables:
  GIT_LFS_SKIP_SMUDGE: "1"

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure

# ─── Stage 1: Secret Scan ────────────────────────────────────────────────────

scan-secrets:
  stage: secret-scan
  image:
    name: zricethezav/gitleaks:v8.18.4
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        RANGE="$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA"
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        RANGE="$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA"
      else
        RANGE="$CI_COMMIT_SHA"
      fi
      gitleaks detect --source . --config .gitleaks.toml --verbose --redact --log-opts="$RANGE"
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(Phase_1|clean_Phase_1|main|Phase_2)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  timeout: 10 minutes
  allow_failure: false

# ─── Stage 2: SCA Dependencies ───────────────────────────────────────────────

audit-backend:
  stage: sca-deps
  needs: [scan-secrets]
  image: python:3.11-slim
  before_script:
    - pip install pip-audit --quiet
  script:
    - pip-audit -r app/backend/requirements.txt
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(Phase_1|clean_Phase_1|main|Phase_2)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  timeout: 10 minutes
  allow_failure: false

audit-frontend:
  stage: sca-deps
  needs: [scan-secrets]
  image: node:18-alpine
  before_script:
    - npm install -g pnpm --quiet
    - cd app/frontend && pnpm install --frozen-lockfile
  script:
    - pnpm audit --json > pnpm-audit.json || true
    - pnpm audit --audit-level=high
  artifacts:
    paths:
      - app/frontend/pnpm-audit.json
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(Phase_1|clean_Phase_1|main|Phase_2)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  timeout: 10 minutes
  allow_failure: false

# ─── Stage 3: SAST (Semgrep) ─────────────────────────────────────────────────

sast-auto:
  stage: sast
  needs: [audit-backend, audit-frontend]
  image: python:3.11-slim
  before_script:
    - pip install semgrep --quiet
  script:
    - semgrep scan --config auto --severity WARNING --severity ERROR --sarif -o sast-auto.sarif app/backend app/frontend app/ml-microservice app/rag-service
  artifacts:
    paths:
      - sast-auto.sarif
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(Phase_1|clean_Phase_1|main|Phase_2)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  timeout: 10 minutes
  allow_failure: false

sast-explicit:
  stage: sast
  needs: [audit-backend, audit-frontend]
  image: python:3.11-slim
  before_script:
    - pip install semgrep --quiet
  script:
    - semgrep scan --config p/owasp-top-ten --config p/python --config p/typescript --severity WARNING --severity ERROR --sarif -o sast-explicit.sarif app/backend app/frontend app/ml-microservice app/rag-service
  artifacts:
    paths:
      - sast-explicit.sarif
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(Phase_1|clean_Phase_1|main|Phase_2)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  timeout: 10 minutes
  allow_failure: false

sast-custom:
  stage: sast
  needs: [audit-backend, audit-frontend]
  image: python:3.11-slim
  before_script:
    - pip install semgrep --quiet
  script:
    - semgrep scan --config .semgrep/custom.yml --severity WARNING --severity ERROR --sarif -o sast-custom.sarif app/backend app/frontend app/ml-microservice app/rag-service
  artifacts:
    paths:
      - sast-custom.sarif
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(Phase_1|clean_Phase_1|main|Phase_2)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  timeout: 10 minutes
  allow_failure: false

# ─── Stage 4: SonarQube (self-hosted, local runner only) ────────────────────

sonarqube-scan:
  stage: sonarqube
  needs: [sast-auto, sast-explicit, sast-custom]
  tags: [local]
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    SONAR_HOST_URL: "http://host.docker.internal:9090"
    GIT_DEPTH: "0"
  script:
    - sonar-scanner
      -Dsonar.projectKey=eamsagemcom
      -Dsonar.sources=app/backend,app/frontend,app/ml-microservice,app/rag-service
      -Dsonar.exclusions=app/frontend/seo-scripts/**,**/node_modules/**,**/dist/**
      -Dsonar.issue.ignore.multicriteria=r3f
      -Dsonar.issue.ignore.multicriteria.r3f.ruleKey=typescript:S6747
      -Dsonar.issue.ignore.multicriteria.r3f.resourceKey=app/frontend/src/modules/shared/machines/components/3d/**/*.tsx
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.token=$sonar
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(Phase_1|clean_Phase_1|main|Phase_2)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  timeout: 15 minutes
  allow_failure: false

# ─── Stage 5: Build images + IaC scan (parallel, self-hosted local runner) ──

build-images:
  stage: build
  needs: [sonarqube-scan]
  tags: [local]
  image: docker:24-cli
  script:
    - docker build -t eam-backend:ci ./app/backend
    - docker build -t eam-frontend:ci --build-arg VITE_API_BASE_URL=http://localhost:8000 ./app/frontend
    - docker build -t eam-ml-microservice:ci ./app/ml-microservice
    - docker build -t eam-rag-service:ci ./app/rag-service
    - docker build -t eam-ml-research:ci -f app/ml-microservice/ml_research/Dockerfile .
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(Phase_1|clean_Phase_1|main|Phase_2)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  timeout: 30 minutes
  allow_failure: false

iac-scan:
  stage: build
  needs: [sonarqube-scan]
  tags: [local]
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - |
      FAILED=0
      for f in docker-compose.yml docker-compose.sonarqube.yml docker-compose.notebooks.yml; do
        BASENAME=$(echo "$f" | sed 's/\.yml$//' | sed 's/[^a-zA-Z0-9_-]/-/g')
        trivy config --severity CRITICAL,HIGH,MEDIUM,LOW --format sarif -o "trivy-iac-${BASENAME}.sarif" --exit-code 1 "$f" || FAILED=1
      done
      exit $FAILED
  artifacts:
    paths:
      - trivy-iac-*.sarif
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(Phase_1|clean_Phase_1|main|Phase_2)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  timeout: 10 minutes
  allow_failure: false


# ─── Stage 6: Image Vulnerability Scan (Trivy, self-hosted local runner) ────

image-scan:
  stage: image-scan
  needs: [build-images]
  tags: [local]
  image: aquasec/trivy:latest
  script:
    - |
      FAILED=0
      for img in eam-backend:ci eam-frontend:ci eam-ml-microservice:ci eam-rag-service:ci eam-ml-research:ci; do
        TAGNAME=$(echo "$img" | cut -d: -f1)
        trivy image --severity CRITICAL,HIGH,MEDIUM,LOW --format sarif -o "trivy-image-${TAGNAME}.sarif" --exit-code 1 "$img" || FAILED=1
      done
      exit $FAILED
  artifacts:
    paths:
      - trivy-image-*.sarif
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(Phase_1|clean_Phase_1|main|Phase_2)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  timeout: 15 minutes
  allow_failure: false


# ─── Stage 7: Lint (non-blocking) ────────────────────────────────────────────

lint-backend:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install ruff --quiet
  script:
    - ruff check app/backend/ --output-format=github
    - ruff format --check app/backend/
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(Phase_1|clean_Phase_1|main|Phase_2)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  timeout: 5 minutes
  allow_failure: true

lint-frontend:
  stage: lint
  image: node:18-alpine
  before_script:
    - npm install -g pnpm --quiet
    - cd app/frontend && pnpm install --frozen-lockfile
  script:
    - pnpm run lint
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(Phase_1|clean_Phase_1|main|Phase_2)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  timeout: 5 minutes
  allow_failure: true

# ─── Stage 8: Quality Gate ───────────────────────────────────────────────────

quality-gate:
  stage: gate
  image: alpine:3.19
  needs:
    - scan-secrets
    - audit-backend
    - audit-frontend
    - sast-auto
    - sast-explicit
    - sast-custom
    - sonarqube-scan
    - build-images
    - iac-scan
    - image-scan
    - job: lint-backend
      optional: true
    - job: lint-frontend
      optional: true
  script:
    - |
      echo "All blocking security gates passed."
      echo "  Secret scan   -- PASSED"
      echo "  Backend SCA   -- PASSED"
      echo "  Frontend SCA  -- PASSED"
      echo "  SAST (auto/explicit/custom) -- PASSED"
      echo "  SonarQube     -- PASSED"
      echo "  Image build   -- PASSED"
      echo "  IaC scan (Trivy)    -- PASSED"
      echo "  Image scan (Trivy)  -- PASSED"
      echo "  Lint jobs are non-blocking (warn only)"
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(Phase_1|clean_Phase_1|main|Phase_2)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  timeout: 2 minutes
  allow_failure: false
