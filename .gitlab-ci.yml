# EAMSagemCom — Source Code Security Pipeline
# Stages: secret-scan → sca-deps → sast → build → image-scan → lint → gate
# Blocking: build-images, quality-gate
# Non-blocking (allow_failure: true, visibility over gating): scan-secrets,
# audit-backend, audit-frontend, license-scan-backend, license-scan-frontend,
# sonarqube-scan, iac-scan, image-scan, lint-backend, lint-frontend
# SonarQube is the sole SAST tool (Semgrep removed). sonarqube-scan requires a
# self-hosted runner tagged "local" + local SonarQube on http://host.docker.internal:9090
# SonarQube Community Edition has no branch analysis — the project key is suffixed
# with $CI_COMMIT_REF_SLUG so each branch gets its own project (poor-man's branch
# separation, works within CE's free-tier limits).

stages:
  - secret-scan
  - sca-deps
  - sast
  - build
  - image-scan
  - lint
  - gate

variables:
  GIT_LFS_SKIP_SMUDGE: "1"

# Shared branch/MR trigger condition. Matches "main", any "clean_Phase_N",
# and any "Phase_N" branch — so Phase_3, Phase_4, etc. get full pipeline
# coverage automatically, with zero edits to this file.
.branch-rules: &branch-rules
  - if: $CI_COMMIT_BRANCH =~ /^(main|clean_Phase_\d+|Phase_\d+)$/
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure

# ─── Stage 1: Secret Scan ────────────────────────────────────────────────────

scan-secrets:
  stage: secret-scan
  image:
    name: zricethezav/gitleaks:v8.18.4
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  before_script:
    - 'apk add --no-cache python3 2>/dev/null || echo "WARN: could not install python3, terminal report will be skipped"'
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        RANGE="$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA"
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        RANGE="$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA"
      else
        RANGE="$CI_COMMIT_SHA"
      fi
      gitleaks detect \
        --source . \
        --config .gitleaks.toml \
        --verbose \
        --redact \
        --log-opts="$RANGE" \
        --report-format json \
        --report-path gitleaks-report.json \
        --exit-code 0
      python3 monitoring/scripts/security_report.py gitleaks gitleaks-report.json "$CI_COMMIT_REF_NAME" || true
  artifacts:
    paths:
      - gitleaks-report.json
    expire_in: 1 week
    when: always
  rules: *branch-rules
  timeout: 10 minutes
  allow_failure: true

# ─── Stage 2: SCA Dependencies ───────────────────────────────────────────────

audit-backend:
  stage: sca-deps
  needs: [scan-secrets]
  image: python:3.11-slim
  before_script:
    - pip install pip-audit --quiet
  script:
    - |
      pip-audit -r app/backend/requirements.txt -f json -o pip-audit-report.json || true
      python3 monitoring/scripts/security_report.py pip-audit pip-audit-report.json "app/backend/requirements.txt"
  artifacts:
    paths:
      - pip-audit-report.json
    expire_in: 1 week
    when: always
  rules: *branch-rules
  timeout: 10 minutes
  allow_failure: true

audit-frontend:
  stage: sca-deps
  needs: [scan-secrets]
  image: node:18-alpine
  before_script:
    - 'apk add --no-cache python3 2>/dev/null || echo "WARN: could not install python3, terminal report will be skipped"'
    - npm install -g pnpm --quiet
    - cd app/frontend && pnpm install --frozen-lockfile
  script:
    - |
      cd app/frontend
      pnpm audit --json > pnpm-audit.json || true
      python3 ../../monitoring/scripts/security_report.py pnpm-audit pnpm-audit.json "app/frontend/package.json"
  artifacts:
    paths:
      - app/frontend/pnpm-audit.json
    expire_in: 1 week
    when: always
  rules: *branch-rules
  timeout: 10 minutes
  allow_failure: true

license-scan-backend:
  stage: sca-deps
  needs: [scan-secrets]
  image: python:3.11-slim
  before_script:
    - pip install --quiet pip-licenses
    - pip install --quiet -r app/backend/requirements.txt
  script:
    - |
      echo "================================================================"
      echo "  LICENSE COMPLIANCE — Backend (Python)"
      echo "================================================================"
      pip-licenses --format=json --with-urls --output-file=licenses-backend.json
      pip-licenses --format=plain-vertical --with-urls
      echo "================================================================"
  artifacts:
    paths:
      - licenses-backend.json
    expire_in: 1 week
    when: always
  rules: *branch-rules
  timeout: 10 minutes
  allow_failure: true

license-scan-frontend:
  stage: sca-deps
  needs: [scan-secrets]
  image: node:18-alpine
  before_script:
    - npm install -g pnpm license-checker --quiet
    - cd app/frontend && pnpm install --frozen-lockfile
  script:
    - |
      cd app/frontend
      echo "================================================================"
      echo "  LICENSE COMPLIANCE — Frontend (npm)"
      echo "================================================================"
      license-checker --json --out ../../licenses-frontend.json
      license-checker --summary
      echo "================================================================"
  artifacts:
    paths:
      - licenses-frontend.json
    expire_in: 1 week
    when: always
  rules: *branch-rules
  timeout: 10 minutes
  allow_failure: true

# ─── Stage 3: SonarQube (self-hosted, local runner only) — sole SAST tool ───
# Community Edition has no branch analysis: each branch gets its own SonarQube
# project (projectKey suffixed with $CI_COMMIT_REF_SLUG) so results don't get
# overwritten cross-branch. Dashboards live at
# http://host.docker.internal:9090/dashboard?id=eamsagemcom-<branch-slug>
# allow_failure: true — quality gate failures are surfaced via sonar_report.py's
# terminal output and the job's warning icon, not a pipeline block.

sonarqube-scan:
  stage: sast
  needs: [audit-backend, audit-frontend]
  tags: [local]
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    SONAR_HOST_URL: "http://host.docker.internal:9090"
    SONAR_PROJECT_KEY: "eamsagemcom-$CI_COMMIT_REF_SLUG"
    GIT_DEPTH: "0"
  before_script:
    - '(apt-get update -qq && apt-get install -y -qq python3 2>/dev/null) || (apk add --no-cache python3 2>/dev/null) || echo "WARN: could not install python3, issue-detail report will be skipped"'
  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=$SONAR_PROJECT_KEY \
        -Dsonar.projectName="EAMSagemCom ($CI_COMMIT_REF_SLUG)" \
        -Dsonar.sources=app/backend,app/frontend,app/ml-microservice,app/rag-service \
        -Dsonar.exclusions=app/frontend/seo-scripts/**,**/node_modules/**,**/dist/**,**/__pycache__/**,**/.venv/**,**/*.egg-info/**,**/.ipynb_checkpoints/** \
        -Dsonar.issue.ignore.multicriteria=r3f \
        -Dsonar.issue.ignore.multicriteria.r3f.ruleKey=typescript:S6747 \
        -Dsonar.issue.ignore.multicriteria.r3f.resourceKey=app/frontend/src/modules/shared/machines/components/3d/**/*.tsx \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.token=$sonar \
        -Dsonar.qualitygate.wait=true \
        -Dsonar.qualitygate.timeout=300 || true
      python3 monitoring/scripts/sonar_report.py "$SONAR_HOST_URL" "$SONAR_PROJECT_KEY" "$sonar" sonar-issues.json || true
  artifacts:
    paths:
      - sonar-issues.json
    expire_in: 1 week
    when: always
  rules: *branch-rules
  timeout: 15 minutes
  allow_failure: true

# ─── Stage 4: Build images + IaC scan (parallel, self-hosted local runner) ──

build-images:
  stage: build
  needs: [sonarqube-scan]
  tags: [local]
  image: docker:24-cli
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - docker build --cache-from eam-backend:ci        -t eam-backend:ci        ./app/backend
    - docker build --cache-from eam-frontend:ci       -t eam-frontend:ci       --build-arg VITE_API_BASE_URL=http://localhost:8000 ./app/frontend
    - docker build --cache-from eam-ml-microservice:ci -t eam-ml-microservice:ci ./app/ml-microservice
    - docker build --cache-from eam-rag-service:ci    -t eam-rag-service:ci    ./app/rag-service
    - docker build --cache-from eam-ml-research:ci    -t eam-ml-research:ci    -f app/ml-microservice/ml_research/Dockerfile .
  rules: *branch-rules
  timeout: 30 minutes
  allow_failure: false

iac-scan:
  stage: build
  needs: [sonarqube-scan]
  tags: [local]
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  before_script:
    - 'apk add --no-cache python3 2>/dev/null || echo "WARN: could not install python3, terminal report will be skipped"'
  script:
    - |
      for f in docker-compose.yml docker-compose.sonarqube.yml docker-compose.notebooks.yml; do
        BASENAME=$(echo "$f" | sed 's/\.yml$//' | sed 's/[^a-zA-Z0-9_-]/-/g')
        trivy config --severity CRITICAL,HIGH,MEDIUM,LOW --format json --output "trivy-iac-${BASENAME}.json" "$f" || true
        trivy convert --format sarif --output "trivy-iac-${BASENAME}.sarif" "trivy-iac-${BASENAME}.json" || echo "  WARN: sarif conversion failed for $f"
        trivy convert --format template --template "@contrib/html.tpl" --output "trivy-iac-${BASENAME}.html" "trivy-iac-${BASENAME}.json" || echo "  WARN: html conversion failed for $f (template may be unavailable)"
        python3 monitoring/scripts/security_report.py trivy "trivy-iac-${BASENAME}.json" "$f" || true
      done
  artifacts:
    paths:
      - trivy-iac-*.sarif
      - trivy-iac-*.json
      - trivy-iac-*.html
    expire_in: 1 week
    when: always
  rules: *branch-rules
  timeout: 10 minutes
  allow_failure: true


# ─── Stage 5: Image Vulnerability Scan (Trivy, self-hosted local runner) ────

image-scan:
  stage: image-scan
  needs: [build-images]
  tags: [local]
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  before_script:
    - 'apk add --no-cache python3 2>/dev/null || echo "WARN: could not install python3, terminal report will be skipped"'
  script:
    - |
      for img in eam-backend:ci eam-frontend:ci eam-ml-microservice:ci eam-rag-service:ci eam-ml-research:ci; do
        TAGNAME=$(echo "$img" | cut -d: -f1)
        trivy image \
          --severity CRITICAL,HIGH,MEDIUM,LOW \
          --ignore-unfixed \
          --ignorefile monitoring/scanner/.trivyignore \
          --format json \
          --output "trivy-image-${TAGNAME}.json" \
          "$img" || true
        trivy convert --format sarif --output "trivy-image-${TAGNAME}.sarif" "trivy-image-${TAGNAME}.json" || echo "  WARN: sarif conversion failed for $img"
        trivy convert --format template --template "@contrib/html.tpl" --output "trivy-image-${TAGNAME}.html" "trivy-image-${TAGNAME}.json" || echo "  WARN: html conversion failed for $img (template may be unavailable)"
        python3 monitoring/scripts/security_report.py trivy "trivy-image-${TAGNAME}.json" "$img" || true
      done
  artifacts:
    paths:
      - trivy-image-*.sarif
      - trivy-image-*.json
      - trivy-image-*.html
    expire_in: 1 week
    when: always
  rules: *branch-rules
  timeout: 15 minutes
  allow_failure: true

# Push Trivy scan results to Prometheus Pushgateway for continuous monitoring.
# Uses JSON artifacts from image-scan.  allow_failure=true so a down monitoring
# stack never blocks the pipeline.
push-vuln-metrics:
  stage: image-scan
  needs: [image-scan]
  when: always
  tags: [local]
  image: python:3.11-slim
  script:
    - |
      export PUSHGATEWAY_URL="${PUSHGATEWAY_URL:-http://host.docker.internal:9091}"
      echo "Pushing Trivy scan metrics to Pushgateway at ${PUSHGATEWAY_URL} ..."
      for img in eam-backend eam-frontend eam-ml-microservice eam-rag-service eam-ml-research; do
        JSON_FILE="trivy-image-${img}.json"
        if [ -f "$JSON_FILE" ]; then
          echo "  → ${img}"
          python3 monitoring/scripts/trivy_push_metrics.py \
            "$JSON_FILE" \
            "${img}:ci" \
            "$PUSHGATEWAY_URL"
        else
          echo "  WARN: ${JSON_FILE} not found (scan may have failed), skipping"
        fi
      done
  rules: *branch-rules
  timeout: 5 minutes
  allow_failure: true


# Restart continuous Trivy scanner so it immediately re-scans the freshly built
# :ci images instead of waiting up to 6h for the next scheduled cycle.
# allow_failure=true — a stopped monitoring stack must not block the pipeline.
restart-scanner:
  stage: image-scan
  needs: [push-vuln-metrics]
  when: always
  tags: [local]
  image: docker:24-cli
  script:
    - |
      if docker restart eam_trivy_scanner; then
        echo "Scanner restarted - rescan cycle started."
      else
        echo "WARN: could not restart scanner (monitoring stack may be down)."
      fi
  rules: *branch-rules
  timeout: 2 minutes
  allow_failure: true

# ─── Stage 6: Lint (non-blocking) ────────────────────────────────────────────

lint-backend:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install ruff --quiet
  script:
    - ruff check app/backend/ --output-format=github
    - ruff format --check app/backend/
  rules: *branch-rules
  timeout: 5 minutes
  allow_failure: true

lint-frontend:
  stage: lint
  image: node:18-alpine
  before_script:
    - npm install -g pnpm --quiet
    - cd app/frontend && pnpm install --frozen-lockfile
  script:
    - pnpm run lint
  rules: *branch-rules
  timeout: 5 minutes
  allow_failure: true

# ─── Stage 7: Quality Gate ───────────────────────────────────────────────────

quality-gate:
  stage: gate
  image: alpine:3.19
  needs:
    - scan-secrets
    - audit-backend
    - audit-frontend
    - sonarqube-scan
    - build-images
    - iac-scan
    - image-scan
    - job: license-scan-backend
      optional: true
    - job: license-scan-frontend
      optional: true
    - job: push-vuln-metrics
      optional: true
    - job: lint-backend
      optional: true
    - job: lint-frontend
      optional: true
  script:
    - |
      echo "All required pipeline stages completed."
      echo "  Secret scan          -- RAN (findings, if any, shown above; non-blocking)"
      echo "  Backend SCA          -- RAN (findings, if any, shown above; non-blocking)"
      echo "  Frontend SCA         -- RAN (findings, if any, shown above; non-blocking)"
      echo "  License compliance   -- RAN (informational)"
      echo "  SonarQube (SAST)     -- RAN (findings, if any, shown above; non-blocking)"
      echo "  Image build          -- PASSED (blocking)"
      echo "  IaC scan (Trivy)     -- RAN (findings, if any, shown above; non-blocking)"
      echo "  Image scan (Trivy)   -- RAN (findings, if any, shown above; non-blocking)"
      echo ""
      echo "Security jobs provide visibility, not gating — review terminal output"
      echo "and job artifacts (SARIF/JSON/HTML) above for full details."
  rules: *branch-rules
  timeout: 2 minutes
  allow_failure: false
