rules:
  - id: sqlalchemy-raw-sql-interpolation
    languages: [python]
    severity: WARNING
    message: >-
      SQL query built via string interpolation instead of bound parameters.
      Use SQLAlchemy's parameter binding (`:name` placeholders + a params
      dict) instead of f-strings, `.format()`, or `%` to avoid SQL injection.
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      references:
        - https://owasp.org/www-community/attacks/SQL_Injection
    patterns:
      - pattern-either:
          - pattern: text(f"...")
          - pattern: text("..." % ...)
          - pattern: text("...".format(...))
  - id: fastapi-cors-wildcard-with-credentials
    languages: [python]
    severity: ERROR
    message: >-
      CORSMiddleware allows any origin (allow_origins=["*"]) while also
      allowing credentials. Browsers reject this combination for good
      reason — it lets any website read authenticated responses. Set an
      explicit origin allowlist, or drop allow_credentials if wildcard
      origins are required.
    metadata:
      category: security
      cwe: "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
    patterns:
      - pattern: $APP.add_middleware(CORSMiddleware, ...)
      - pattern-inside: $APP.add_middleware(CORSMiddleware, ..., allow_origins=["*"], ...)
      - pattern-inside: $APP.add_middleware(CORSMiddleware, ..., allow_credentials=True, ...)
  - id: hardcoded-secret-default
    languages: [python]
    severity: ERROR
    message: >-
      A secret-like environment variable (SECRET_KEY/JWT_SECRET) has a
      hardcoded, non-empty fallback default. If the env var is ever unset
      in production, the app silently runs with a known, guessable secret.
      Fail loudly instead: raise if the env var is missing, don't provide
      a default.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
    patterns:
      - pattern-either:
          - pattern: os.getenv("SECRET_KEY", $DEFAULT)
          - pattern: os.getenv("JWT_SECRET", $DEFAULT)
          - pattern: os.environ.get("SECRET_KEY", $DEFAULT)
          - pattern: os.environ.get("JWT_SECRET", $DEFAULT)
      - metavariable-pattern:
          metavariable: $DEFAULT
          patterns:
            - pattern-not: '""'
            - pattern-not: 'None'
  - id: subprocess-dynamic-input
    languages: [python]
    severity: WARNING
    message: >-
      subprocess/os.system call built with a non-literal (dynamic) command
      argument. If any part of that value can be influenced by user input,
      this is command injection. Use a fixed argument list and pass
      dynamic data as separate array elements, never concatenated or
      interpolated into the command string.
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
    patterns:
      - pattern-either:
          - pattern: subprocess.run(f"...", ...)
          - pattern: subprocess.run("..." + ..., ...)
          - pattern: subprocess.call(f"...", ...)
          - pattern: subprocess.call("..." + ..., ...)
          - pattern: os.system(f"...")
          - pattern: os.system("..." + ...)
