global:
  scrape_interval: 60s
  evaluation_interval: 60s
  scrape_timeout: 30s
  external_labels:
    environment: 'production'
    project: 'eam-sagemcom'

rule_files:
  - /etc/prometheus/rules/*.yml

# Alertmanager is optional — configure if you add one
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Pushgateway — receives metrics from CI pipeline + continuous scanner
  # honor_labels=true preserves the 'job' label from the pushed payload
  # so per-image metrics show correct labels
  - job_name: 'trivy'
    honor_labels: true
    honor_timestamps: true
    static_configs:
      - targets: ['pushgateway:9091']
    scrape_interval: 30s
    metrics_path: /metrics

  # Pushgateway health
  - job_name: 'pushgateway'
    static_configs:
      - targets: ['pushgateway:9091']
    metrics_path: /-/healthy
    scrape_interval: 30s
