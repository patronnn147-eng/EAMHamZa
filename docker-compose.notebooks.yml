# ML Research environment — NOT production
# Usage:
#   docker compose -f docker-compose.notebooks.yml up --build
#   Open: http://localhost:8888
#
# Mounts entire project so notebooks can access:
#   /workspace/app/ml-microservice/ml_research/  ← .ipynb files
#   /workspace/ai4i2020.csv                       ← dataset
#   /workspace/app/backend/modules/ml/models/     ← saved models
#   /workspace/ml_problems/                       ← shared feature engineering

services:
  notebooks:
    build:
      context: .
      dockerfile: app/ml-microservice/ml_research/Dockerfile
    container_name: eam_notebooks
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace
      PYTHONUNBUFFERED: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
